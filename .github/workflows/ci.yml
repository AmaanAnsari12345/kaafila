name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: kaafila
          POSTGRES_USER: kaafila
          POSTGRES_PASSWORD: kaafila
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaafila -d kaafila"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kaafila:kaafila@localhost:5432/kaafila?schema=public
      REDIS_URL: redis://localhost:6379
      PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Shared package build + unit tests
        run: |
          pnpm --filter @kaafila/shared build
          pnpm --filter @kaafila/shared test
      - name: Prisma generate, validate and migrate
        run: |
          pnpm --filter @kaafila/api db:generate
          pnpm --filter @kaafila/api exec prisma validate
          pnpm --filter @kaafila/api db:deploy
          pnpm --filter @kaafila/api exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: pnpm typecheck
      - run: pnpm build
      - name: API end-to-end smoke test (real Postgres + Redis)
        run: pnpm --filter @kaafila/api test:smoke
